name: Docker Publish

on:
  workflow_run:
    workflows: [ "Tests" ]
    types: [ completed ]
    branches: [ main ]
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - name: Determine whether to proceed
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event.workflow_run.conclusion }}" = "success" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

  tag:
    needs: gate
    if: needs.gate.outputs.proceed == 'true' && github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    permissions: write-all
    concurrency:
      group: tag-creation
      cancel-in-progress: false
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Determine next version
        id: semver
        uses: ietf-tools/semver-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
          patchAll: true
          noNewCommitBehavior: current
          fallbackTag: v0.0.0

      - name: Tag with the version
        if: steps.semver.outputs.bump != 'none'
        run: |
          git tag ${{ steps.semver.outputs.next }}
          git push origin ${{ steps.semver.outputs.next }}

  publish-prep:
    needs: [ gate, tag ]
    if: always() && needs.gate.outputs.proceed == 'true' && (needs.tag.result == 'success' || needs.tag.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      timestamp: ${{ steps.set-time.outputs.timestamp }}
    steps:
      - name: Generate timestamp
        id: set-time
        run: echo "timestamp=$(date +'%Y%m%d-%H%M')" >> $GITHUB_OUTPUT

  publish:
    needs: [ gate, tag, publish-prep ]
    if: always() && needs.gate.outputs.proceed == 'true' && (needs.tag.result == 'success' || needs.tag.result == 'skipped') && needs.publish-prep.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: web
            image: dgknght/clj-money-web
          - target: util
            image: dgknght/clj-money-util
    env:
      DOCKER_METADATA_PR_HEAD_SHA: true
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Log into docker hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract tags and labels
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ needs.publish-prep.outputs.timestamp }},enable={{is_default_branch}}
            type=sha,prefix=
          flavor: |
            latest=false

      - name: Build and push the docker image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
