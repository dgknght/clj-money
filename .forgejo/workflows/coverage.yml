name: Coverage

# The build workflow runs the tests in parallel processes, which cloverage
# can't measure, so coverage is checked here, nightly, in a single process.

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch: {}

jobs:
  coverage:
    runs-on: ubuntu-latest
    env:
      # env/test/config.edn ignores environment variables, so override it
      # with JVM system properties
      JVM_OPTS: -Dsql.host=postgres -Dredis.host=redis -Dredis.password= -Dsession.secret=ci-secret-16byte
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: please03
          POSTGRES_USER: adm_user
          POSTGRES_DB: adm_user
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:8
        options: >-
          --health-cmd "redis-cli -a please04 ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - name: Checkout source code
        uses: https://data.forgejo.org/actions/checkout@v7
      - name: Cache dependencies
        uses: https://code.forgejo.org/actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.lein
          key: ${{ runner.os }}-lein-${{ hashFiles('project.clj') }}
          restore-keys: |
            ${{ runner.os }}-lein-
      - name: Install clojure tools
        uses: https://git.dgknght.com/dgknght/setup-clojure@v1
        with:
          java-version: 25
          lein-version: 2.12.0
          clj-kondo-version: '2026.01.19'
      - name: Install dependencies
        run: lein deps
      - name: Set up the database
        run: lein with-profile +test do create-sql, migrate, migrate-auxiliary, partition 2015-01-01 2017-12-31
      - name: Run tests
        run: lein cloverage
